<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Beep</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101114; color: #f5f5f5; padding: 20px; }
    main { width: 100%; max-width: 360px; text-align: center; }
    h1 { font-size: 1.8rem; margin: 0 0 10px; }
    p { color: #a7a7ad; line-height: 1.5; }
    .circle { width: 136px; height: 136px; border-radius: 50%; margin: 30px auto 20px; background: #2a2c32; border: 8px solid #3b3d43; display: grid; place-items: center; font-size: 1.15rem; font-weight: 700; transition: background .08s, transform .08s; }
    .circle.pressed { background: #21a675; border-color: #64d8ab; color: #06281b; transform: scale(.96); }
    button { width: 100%; border: 0; border-radius: 12px; padding: 15px; color: white; background: #476dff; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #5b7dff; }
    kbd { display: inline-block; padding: 1px 6px; border-radius: 5px; background: #30323a; color: #f5f5f5; font: inherit; font-size: .85em; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { font-size: .92rem; min-height: 2.8em; margin: 16px 0; overflow-wrap: anywhere; }
    small { display: block; color: #8d909a; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Button Beep</h1>
    <p>Press <kbd>Space</kbd> or connect your Arduino Uno to play your custom sound.</p>
    <div class="circle" id="indicator">Ready</div>
    <button id="connect">Connect Arduino</button>
    <p id="status" role="status" aria-live="polite">Not connected — press Space to play</p>
    <small>Using sounds.mp3 • USB serial at 9600 baud</small>
  </main>

  <script>
    const button = document.querySelector('#connect');
    const indicator = document.querySelector('#indicator');
    const status = document.querySelector('#status');

    let port = null;
    let reader = null;
    let listening = false;
    let audio = null;
    let soundBuffer = null;
    let soundLoading = null;
    let activeSound = null;
    let spaceHeld = false;
    let physicalHeld = false;

    function show(message, pressed = false) {
      status.textContent = message;
      indicator.textContent = pressed ? 'PLAY!' : 'Ready';
      indicator.classList.toggle('pressed', pressed);
    }

    // Load the MP3 from the same folder as index.html.
    function initAudio() {
      audio ??= new AudioContext();
      // Called from a click or keyboard press to unlock browser audio.
      return audio.resume();
    }

    async function loadSound() {
      if (soundBuffer) return;
      if (!soundLoading) {
        soundLoading = (async () => {
          const response = await fetch('./sounds.mp3');
          if (!response.ok) {
            throw new Error(`Could not load sounds.mp3 (HTTP ${response.status}). Check its filename in GitHub.`);
          }
          try {
            soundBuffer = await audio.decodeAudioData(await response.arrayBuffer());
          } catch {
            throw new Error('sounds.mp3 could not be decoded. Try another MP3 file.');
          }
        })().finally(() => { soundLoading = null; });
      }
      await soundLoading;
    }

    async function playFromSpace() {
      try {
        const audioReady = initAudio();
        if (!soundBuffer) show('Loading sounds.mp3…');
        await audioReady;
        await loadSound();
        playSound();
        if (!spaceHeld && !physicalHeld) show(listening ? 'Connected — press button or Space' : 'Ready — press Space');
      } catch (error) {
        show(`Could not play sound: ${error.message}`);
      }
    }

    // Space triggers the exact same MP3 even without an Arduino connected.
    // Ignore key repeats and text fields. Space works even when Connect has focus.
    document.addEventListener('keydown', event => {
      if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest?.('input, textarea, select, [contenteditable]')) return;
      event.preventDefault(); // Prevent page scrolling when pressing Space.
      spaceHeld = true;
      void playFromSpace();
    });

    document.addEventListener('keyup', event => {
      if (event.code !== 'Space' || !spaceHeld) return;
      event.preventDefault();
      spaceHeld = false;
      if (!physicalHeld) show(listening ? 'Connected — press button or Space' : 'Ready — press Space');
    });

    function playSound() {
      if (!audio || !soundBuffer) return;

      // A new press starts the sound from the beginning.
      if (activeSound) {
        try { activeSound.stop(); } catch {}
        activeSound = null;
      }

      const source = audio.createBufferSource();
      const volume = audio.createGain();
      source.buffer = soundBuffer;
      volume.gain.value = 0.8;
      source.connect(volume).connect(audio.destination);
      source.onended = () => {
        if (activeSound === source) activeSound = null;
        source.disconnect();
        volume.disconnect();
      };
      activeSound = source;
      source.start();
      show('Playing custom sound', true);
    }

    function handleLine(line) {
      if (line.trim() === 'PRESSED') { physicalHeld = true; playSound(); }
      if (line.trim() === 'RELEASED') {
        physicalHeld = false;
        if (!spaceHeld) show('Connected — press button or Space');
      }
      // The full sound plays on each press, even after releasing the button.
    }

    async function readSerial() {
      const decoder = new TextDecoder();
      let pending = '';
      try {
        reader = port.readable.getReader();
        while (listening) {
          const { value, done } = await reader.read();
          if (done) break;
          pending += decoder.decode(value, { stream: true });
          let end;
          while ((end = pending.indexOf('\n')) !== -1) {
            handleLine(pending.slice(0, end));
            pending = pending.slice(end + 1);
          }
          if (pending.length > 256) pending = '';
        }
      } catch (error) {
        if (listening) show(`Connection lost: ${error.message}`);
      } finally {
        listening = false;
        if (reader) { reader.releaseLock(); reader = null; }
        try { await port?.close(); } catch {}
        port = null;
        button.textContent = 'Connect Arduino';
        button.disabled = false;
        physicalHeld = false;
        if (!status.textContent.startsWith('Connection lost')) show('Disconnected — press Space to play');
      }
    }

    button.addEventListener('click', async () => {
      if (listening) {
        button.disabled = true;
        listening = false;
        try { await reader?.cancel(); } catch {}
        return;
      }

      if (!('serial' in navigator)) {
        show('Web Serial unavailable. Use Chrome or Edge over HTTPS.');
        return;
      }

      button.disabled = true;
      let chosen = null;
      try {
        // Resume audio directly on a click, so later USB events can play it.
        const audioReady = initAudio();
        chosen = await navigator.serial.requestPort();
        await audioReady;
        show('Loading sounds.mp3…');
        await loadSound();
        await chosen.open({ baudRate: 9600 });
        port = chosen;
        listening = true;
        button.textContent = 'Disconnect';
        button.disabled = false;
        show('Connected — press button or Space');
        await readSerial();
      } catch (error) {
        if (chosen && chosen !== port) { try { await chosen.close(); } catch {} }
        show(`Could not connect: ${error.message}`);
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
